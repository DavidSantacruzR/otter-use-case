[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f3"
textColor = "#0b0b0b"
borderColor = "#e3e2dd"
# Validated categorical palette (adjacent-pair CVD ΔE ≥ 8, normal-vision ΔE ≥ 15).
chartCategoricalColors = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]

[theme.dark]
backgroundColor = "#141413"
secondaryBackgroundColor = "#1f1f1e"
textColor = "#ffffff"
borderColor = "#3a3a37"
primaryColor = "#3987e5"
# The same eight hues, re-stepped for the dark surface.
chartCategoricalColors = [
    "#3987e5", "#d95926", "#199e70", "#c98500",
    "#d55181", "#008300", "#9085e9", "#e66767",
]
